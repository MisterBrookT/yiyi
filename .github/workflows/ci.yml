name: macOS tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test
      - name: Release build
        run: swift build -c release
      - name: Website checks
        run: python3 scripts/check-site.py
